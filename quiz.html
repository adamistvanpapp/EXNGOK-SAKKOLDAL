<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakk Quiz</title>
    <meta name="description" content="Kvíz a sakk alapjairól és szabályairól, hogy teszteld tudásodat.">
    <meta name="author" content="EXNGOK">
    <link rel="stylesheet" href="css/sakkoldal.css">
    <link rel="icon" type="image/x-icon" href="media/favicon.ico">
</head>
<body>

    <header class="logo">
        <a href="jatek.html">
            <img src="media/logo.png" alt="SakkMindenkié">
        </a>
    </header>

   <a href="kezdolap.html" class="btn-home">Vissza a kezdőlapra</a>

    <div class="chess-container">

        <h1 class="page-title">Sakk Quiz</h1>

        <div class="quiz-card" id="quiz-box">
            <h2 id="question" class="quiz-question">Kérdés betöltése...</h2>

            <div id="answers" class="answers-container"></div>

            <img id="question-image" class="hidden" alt="Kérdés kép" src="media/quizkonnyu1.jpg">

            <button id="next-btn" class="next-btn hidden">Következő</button>
        </div>

        <div class="quiz-card hidden" id="result-box">
            <h2 class="quiz-result-title">Eredmény</h2>
            <p id="score" class="quiz-score"></p>
            <button class="restart-btn" onclick="location.reload()">Újra</button>
        </div>

    </div>

<script src="js/quiz.js"></script>
</body>
</html>
