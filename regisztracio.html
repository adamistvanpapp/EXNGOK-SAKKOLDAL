<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regisztráció</title>
    <link rel="stylesheet" href="css/sakkoldal.css">
    <link rel="icon" type="image/x-icon" href="media/favicon.ico">
</head>
<body>

<header class="logo">
    <a href="jatek.html">
        <img src="media/logo.png" alt="SakkMindenkié">
    </a>
</header>

<a href="index.html" class="btn-home">Vissza a kezdőlapra</a>

<div class="chess-container">
    <h1 class="page-title">Regisztráció</h1>

    <form id="registerForm">

        <label for="username">Felhasználónév:</label>
        <input type="text" id="username">

        <label for="password">Jelszó:</label>
        <input type="password" id="password">

        <label for="birthdate">Születési dátum:</label>
        <input type="date" id="birthdate">

        <label for="email">Email cím:</label>
        <input type="email" id="email">

        <label for="phone">Telefonszám:</label>
        <input type="text" id="phone">

        <label>Nem:</label>
        <div class="gender-options">
            <label><input type="radio" name="gender" value="ferfi"> Férfi</label>
            <label><input type="radio" name="gender" value="no"> Nő</label>
        </div>

        <label for="continent">Kontinens:</label>
        <select id="continent">
            <option value="">Válassz...</option>
            <option value="europa">Európa</option>
            <option value="amerika">Amerika</option>
            <option value="azsia">Ázsia</option>
            <option value="afrika">Afrika</option>
            <option value="ausztralia">Ausztrália</option>
            <option value="del_amerika">Dél-Amerika</option>
        </select>

        <button type="button" id="registerBtn" class="btn">Regisztrálok</button>

        <p class="message" id="message"></p>
    </form>
</div>

<script src="js/register.js"></script>
</body>
</html>
